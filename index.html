 const t=Math.min(1,(now-clinkStart)/1850);cheerRig.visible=true;
 const lift=ease(Math.min(1,t/.3)),touch=ease(Math.max(0,Math.min(1,(t-.27)/.16))),lower=ease(Math.max(0,Math.min(1,(t-.67)/.31)));

function consumeAtTable(kind){
 if(!seated||seatIndex<0||insideWC)return say('Hãy ngồi vào bàn trước nhé');

  diningMode='drink';say('🍺 Nâng cốc, uống bia hơi!');
 }else{
  const idx=items.findIndex(v=>v!=='Bia hơi');if(idx<0)return say('Bàn chưa có món nhậu — hãy gọi món');
  const dish=items[idx];items.splice(idx,1);bitesConsumed++;fullness=Math.min(100,fullness+17);

}
function animateDining(now){
 if(!diningMode){diningRig.visible=false;return}
 diningRig.visible=true;const t=Math.min(1,(now-diningStart)/1700);
 const lift=ease(Math.min(1,t/.45)),lower=ease(Math.max(0,Math.min(1,(t-.62)/.38))),h=lift*(1-lower);

 if(diningMode==='drink'){
  drinkHand.position.set(.32-h*.16,-.48+h*.35,-.64+h*.31);
  drinkHand.rotation.x=-h*.82;drinkHand.rotation.z=h*.13;
 }else{
  chopsticks.position.set(.27-h*.12,-.55+h*.40,-.75+h*.37);
  chopsticks.rotation.x=-.12+h*.22;chopsticks.rotation.z=-h*.12;
 }
 if(t>=1){diningMode='';diningRig.visible=false}
}

let joyX=0,joyY=0;const pad=document.getElementById('pad'),nub=document.getElementById('nub');function movePad(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,k=Math.min(1,46/Math.max(1,Math.hypot(x,y)));joyX=x*k/46;joyY=y*k/46;nub.style.transform='translate('+joyX*37+'px,'+joyY*37+'px)'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);movePad(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))movePad(e)});function reset(){joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);

let prev=performance.now();function frame(now){animateCrowd(now);animateDining(now);const dt=Math.min(.05,(now-prev)/1000);prev=now;const forward=(keys.w?1:0)-(keys.s?1:0)-joyY,side=(keys.d?1:0)-(keys.a?1:0)+joyX;if(!seated&&!insideWC){px+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*2.4;pz+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*dt*2.4;px=Math.max(-5.65,Math.min(5.65,px));pz=Math.max(-7.55,Math.min(5.9,pz))}if(insideWC){px+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*1.7;pz+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*dt*1.7;px=Math.max(-12.1,Math.min(-7.7,px));pz=Math.max(1.75,Math.min(4.25,pz))}if(keys.arrowleft)yaw+=dt*1.7;if(keys.arrowright)yaw-=dt*1.7;camera.position.set(px,seated?1.12:1.65,pz);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;try{animateClink(now)}catch(animationError){clinkActive=false;cheerRig.visible=false;console.error('Lỗi cụng ly:',animationError);say('Lỗi hiệu ứng cụng ly — game vẫn tiếp tục')}try{renderer.render(scene,camera)}catch(renderError){console.error('Lỗi dựng hình:',renderError);const e=document.getElementById('error');e.style.display='block';e.textContent='Lỗi dựng hình: '+renderError.message;return}requestAnimationFrame(frame)}requestAnimationFrame(frame);say('WebGL V4.6 · WC ở giữa tường cuối quán, nhấn E để vào');
