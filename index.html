<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HOANGGIA NHẬU SIMULATOR</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;background:#111b;padding:12px;border-radius:12px;font-size:13px;pointer-events:none}#controls{position:fixed;bottom:24px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;gap:12px}#pad{width:116px;height:116px;border:2px solid #ffffff77;border-radius:50%;touch-action:none;display:grid;place-items:center;background:#ffffff22}#nub{width:42px;height:42px;border-radius:50%;background:#e8ae52;transform:translate(0,0)}#actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}button{border:0;border-radius:12px;padding:13px 9px;background:#e8ae52;color:#24190b;font-weight:700}#menu{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#263342;padding:18px;border-radius:16px;width:min(330px,90vw);box-shadow:0 10px 50px #0009}#menu button{margin:4px}#message{position:fixed;top:24%;width:100%;text-align:center;font-size:19px;font-weight:700;text-shadow:0 2px 8px #000;pointer-events:none}@media(min-width:900px){#pad{opacity:.4}}</style></head><body><canvas id="view"></canvas><div id="hud">🍻 HOANGGIA NHẬU — V1.4<br>WASD: đi · Vuốt: nhìn · E: ngồi<br><span id="status">Đang đứng · Tìm bàn để ngồi</span><br><span id="count">Cụng ly: 0 · Mồi: 0</span></div><div id="message"></div><div id="controls"><div id="pad"><div id="nub"></div></div><div id="actions"><button id="sit">🪑 Ngồi / Đứng</button><button id="order">📜 Gọi món</button><button id="cheers">🍺 Cụng ly</button><button id="dice">🎲 Xúc xắc</button></div></div><div id="menu"><h3>🍽️ Thực đơn quán nhậu</h3><button data-food="Lạc rang">🥜 Lạc rang</button><button data-food="Gà nướng">🍗 Gà nướng</button><button data-food="Mực nướng">🦑 Mực nướng</button><button data-food="Bia ảo">🍺 Bia ảo</button><p><button id="close">Đóng</button></p></div><script>
(()=>{const c=document.getElementById('view'),ctx=c.getContext('2d'),status=document.getElementById('status'),count=document.getElementById('count'),msg=document.getElementById('message');let W=0,H=0,px=0,pz=-7,yaw=0,seated=false,beers=0,food=0,notice=0;const tables=[[-3,-1.8],[0,-1.8],[3,-1.8],[-3,2],[0,2],[3,2]];const keys={};function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}function project(x,y,z){let dx=x-px,dz=z-pz,cs=Math.cos(yaw),sn=Math.sin(yaw),a=dx*cs-dz*sn,b=dx*sn+dz*cs;if(b<.15)return null;const f=Math.min(W,H)*.85;return [W/2+a*f/b,H*.51+(seated?1.12:1.65-y)*f/b,f/b]}function face(verts,color){let p=verts.map(v=>project(...v));if(p.some(v=>!v))return;polygon(p,color)}function box(x,z,sx,sy,sz,col,y=0){const a=x-sx/2,b=x+sx/2,c=z-sz/2,d=z+sz/2;face([[a,y,c],[b,y,c],[b,y+sy,c],[a,y+sy,c]],col);face([[b,y,c],[b,y,d],[b,y+sy,d],[b,y+sy,c]],shade(col,.78));face([[a,y,d],[b,y,d],[b,y+sy,d],[a,y+sy,d]],shade(col,.88));face([[a,y+sy,c],[b,y+sy,c],[b,y+sy,d],[a,y+sy,d]],shade(col,1.22))}function shade(hex,m){let v=parseInt(hex.slice(1),16);return '#'+[v>>16&255,v>>8&255,v&255].map(n=>Math.min(255,Math.round(n*m)).toString(16).padStart(2,'0')).join('')}function table3d(x,z){box(x,z,1.55,.085,1.05,'#8b4f2a',.74);box(x,z,1.38,.11,.88,'#6c3c22',.63);for(const a of [-.59,.59])for(const b of [-.37,.37])box(x+a,z+b,.10,.68,.10,'#4d2c1b');box(x,z,.46,.025,.34,'#d9d0b2',.85);for(const a of [-.38,.38]){box(x+a,z,.12,.19,.12,'#c48b32',.83);box(x+a,z,.10,.045,.10,'#f4df9c',1.01)}box(x,z-.29,.12,.28,.12,'#1d683b',.83);box(x,z-.29,.045,.09,.045,'#d4c29a',1.11)}function chair3d(x,z,rot){const red=(Math.round(x*7+z*11)%2===0),color=red?'#bb3428':'#345d9c';box(x,z,.43,.08,.43,color,.37);for(const u of [-.15,.15])for(const v of [-.15,.15])box(x+u,z+v,.045,.37,.045,color);box(x,z,.3,.025,.3,shade(color,1.15),.45)}function lantern(x,z,y,color){const p=project(x,y,z);if(!p)return;const radius=Math.min(32,Math.max(3,p[2]*.16));const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],radius*3);g.addColorStop(0,'#ffca7b66');g.addColorStop(1,'#ffca7b00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],radius*3,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(p[0],p[1],radius*.7,radius,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e9c99a';ctx.lineWidth=1;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(p[0],p[1],Math.abs(i)*radius*.3+radius*.13,radius,0,0,Math.PI*2);ctx.stroke()}}function tree(x,z){box(x,z,.23,2.65,.24,'#4a3427');for(const [ox,oz,h,sz] of [[0,0,2.7,1],[.6,.1,2.3,.7],[-.6,.2,2.4,.7],[0,-.5,2.6,.8]]){const p=project(x+ox,h,z+oz);if(!p)continue;const r=Math.min(180,Math.max(5,p[2]*sz));ctx.fillStyle='#203f2b';ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38624499';ctx.beginPath();ctx.arc(p[0]-r*.18,p[1]-r*.2,r*.6,0,Math.PI*2);ctx.fill()}}function label(x,z,t){const p=project(x,1.2,z);if(p){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(t,p[0],p[1])}}function render(){ctx.fillStyle='#536778';ctx.fillRect(0,0,W,H*.5);ctx.fillStyle='#80664d';ctx.fillRect(0,H*.5,W,H*.5);const items=[];for(let x=-7;x<=7;x++)for(let z=-9;z<=7;z++){const p=[project(x,0,z),project(x+1,0,z),project(x+1,0,z+1),project(x,0,z+1)];if(p.every(Boolean))items.push({d:(x-px)**2+(z-pz)**2,fn:()=>polygon(p,(x+z)%2?'#897159':'#977d60')})}tables.forEach(([x,z],i)=>{items.push({d:(x-px)**2+(z-pz)**2,fn:()=>{table3d(x,z);label(x,z,'BÀN '+(i+1))}});[[x-1.08,z,1],[x+1.08,z,-1],[x,z-1.02,0],[x,z+1.02,0]].forEach(([cx,cz,rot])=>items.push({d:(cx-px)**2+(cz-pz)**2,fn:()=>chair3d(cx,cz,rot)}))});items.push({d:1500,fn:()=>{face([[-6,0,7],[6,0,7],[6,5,7],[-6,5,7]],'#a78a66');face([[-6,0,-9],[-6,0,7],[-6,5,7],[-6,5,-9]],'#79664d');face([[6,0,-9],[6,0,7],[6,5,7],[6,5,-9]],'#806a50');face([[-5.5,2,6.94],[-2.3,2,6.94],[-2.3,3.6,6.94],[-5.5,3.6,6.94]],'#203c35');face([[2.3,2,6.94],[5.5,2,6.94],[5.5,3.6,6.94],[2.3,3.6,6.94]],'#203c35');face([[-2.4,1.9,6.93],[2.4,1.9,6.93],[2.4,3.1,6.93],[-2.4,3.1,6.93]],'#60301e');const sign=project(0,2.5,6.9);if(sign){ctx.fillStyle='#ffe09a';ctx.font='bold '+Math.max(13,Math.min(25,sign[2]*.22))+'px system-ui';ctx.textAlign='center';ctx.fillText('BIA HƠI HOÀNG GIA',sign[0],sign[1])}}});for(const [x,z] of [[-5,-2],[-5,4],[5,-2],[5,4]])items.push({d:(x-px)**2+(z-pz)**2,fn:()=>tree(x,z)});for(const [x,z] of [[-4,-3],[-2,-3],[0,-3],[2,-3],[4,-3],[-4,1],[-2,1],[0,1],[2,1],[4,1]])items.push({d:(x-px)**2+(z-pz)**2,fn:()=>lantern(x,z,3.2,Math.round(x)%4===0?'#f0bc6b':'#db794d')});items.push({d:70,fn:()=>{box(4.6,5.6,2,.85,.8,'#514b40');box(4.6,5.6,1.9,.08,.8,'#b3a78c',.9);box(-4.5,5.6,1.7,1.25,.65,'#6b4c35');box(-4.5,5.6,1.55,.08,.65,'#d2b083',1.25)}});items.sort((a,b)=>b.d-a.d).forEach(i=>i.fn());ctx.fillStyle='#fff9';ctx.fillRect(W/2-7,H/2,14,2);ctx.fillRect(W/2,H/2-7,2,14);requestAnimationFrame(render)}render();function flash(s){msg.textContent=s;clearTimeout(notice);notice=setTimeout(()=>msg.textContent='',1800)}function nearest(){return tables.map((t,i)=>({i,d:Math.hypot(t[0]-px,t[1]-pz)})).sort((a,b)=>a.d-b.d)[0]}function sit(){if(seated){seated=false;flash('Đã đứng dậy')}else{let n=nearest();if(n.d>2.8){flash('Hãy đi đến gần bàn nhậu');return}seated=true;const t=tables[n.i];px=t[0];pz=t[1]+1.25;yaw=Math.PI;flash('Đã ngồi bàn '+(n.i+1))}status.textContent=seated?'Đang ngồi · Chọn món hoặc chơi':'Đang đứng · Tìm bàn để ngồi'}document.getElementById('sit').onclick=sit;document.getElementById('order').onclick=()=>document.getElementById('menu').style.display='block';document.getElementById('close').onclick=()=>document.getElementById('menu').style.display='none';document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{food++;count.textContent='Cụng ly: '+beers+' · Mồi: '+food;flash('Đã gọi '+b.dataset.food);document.getElementById('menu').style.display='none'});document.getElementById('cheers').onclick=()=>{if(!seated)return flash('Ngồi xuống bàn trước nhé!');beers++;count.textContent='Cụng ly: '+beers+' · Mồi: '+food;flash('Dzô! 🍻')};document.getElementById('dice').onclick=()=>flash('🎲 Xúc xắc: '+(1+Math.floor(Math.random()*6)));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')sit()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let joyX=0,joyY=0;const pad=document.getElementById('pad'),nub=document.getElementById('nub');function joy(e){let r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.max(1,Math.hypot(x,y)),k=Math.min(1,48/m);joyX=x*k/48;joyY=y*k/48;nub.style.transform='translate('+joyX*38+'px,'+joyY*38+'px)'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);joy(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))joy(e)});function stop(){joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);let look=null;c.addEventListener('pointerdown',e=>{look=e.pointerId;c.setPointerCapture(e.pointerId);c._x=e.clientX});c.addEventListener('pointermove',e=>{if(look===e.pointerId){yaw+=(e.clientX-c._x)*.005;c._x=e.clientX}});c.addEventListener('pointerup',()=>look=null);let last=performance.now();function tick(t){let dt=Math.min(.05,(t-last)/1000);last=t;let f=(keys.w?1:0)-(keys.s?1:0)-joyY,r=(keys.d?1:0)-(keys.a?1:0)+joyX;if(!seated){let sp=dt*2.2;px+=Math.cos(yaw)*r*sp+Math.sin(yaw)*f*sp;pz+=-Math.sin(yaw)*r*sp+Math.cos(yaw)*f*sp;px=Math.max(-6,Math.min(6,px));pz=Math.max(-8,Math.min(6,pz))}if(keys.arrowleft)yaw-=dt*1.5;if(keys.arrowright)yaw+=dt*1.5;requestAnimationFrame(tick)}requestAnimationFrame(tick);flash('V1.4 · Tiến vào quán và chọn bàn')})();
</script></body></html>
